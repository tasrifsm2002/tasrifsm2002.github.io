    Experience:
      - company: "BUET, Dept. of EEE — Undergraduate Thesis"
        position: "Voltage-Controlled, High-Frequency PWM Generation via Spin Hall Nano-Oscillator"
        location: Dhaka, Bangladesh
        start_date: 2025-03
        end_date: 2026-06
        summary: >
          Undergraduate thesis supervised by Dr. Orchi Hassan. Defended June 2026; final results pending.
        highlights:
          - Designed a hybrid spintronic-CMOS pulse-width-modulation (PWM) generator built around a field-free Spin Hall Nano-Oscillator (SHNO) driven by spin-orbit torque, replacing conventional high-speed CMOS oscillator cores.
          - "Modeled and compared two circuit architectures: a 7T-1MTJ single-pFET design and a CMOS transmission-gate variant, using a macrospin LLGS magnetization-dynamics model for the MTJ alongside predictive FinFET device cards."
          - Achieved stable GHz-range oscillation with 6-95% duty-cycle tunability at sub-50 microwatt power consumption.

      - company: "BUET, Dept. of EEE — Undergraduate Research"
        position: "Spintronic Non-Volatile Memory: Device Physics and Circuit Design"
        location: Dhaka, Bangladesh
        start_date: 2025-03
        end_date: present
        highlights:
          - Investigating Spin-Transfer Torque (STT) and Spin-Orbit Torque (SOT) switching mechanisms in Magnetic Tunnel Junctions (MTJs) for next-generation Non-Volatile Memory (NVM) architectures.
          - Extending this work toward two-dimensional material platforms, modeling memristive and spintronic device behavior for synaptic and neuronal emulation in neuromorphic hardware.

      - company: Neural Semiconductor Limited (NSL)
        position: Industrial Attachment
        location: Uttara, Dhaka, Bangladesh
        start_date: 2025-11
        end_date: 2025-11
        highlights:
          - Rotated across Analog, Digital VLSI, and RFIC design groups, gaining exposure to the full IC design cycle from specification through tape-out.
          - "Analog & RFIC: practiced impedance matching and area-efficient layout techniques for RF building blocks and floorplanning."
          - "Digital VLSI: contributed to power-aware RTL design with synthesis-oriented coding practices."
          - Performed physical verification (DRC and LVS) and design-rule debugging to achieve design closure using industry-standard EDA tools.

