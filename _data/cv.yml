  - title: Research Experience
    type: entries
    items:
      - heading: "Voltage Controlled High-Frequency Pulse Width Modulation Generation based on Spin Hall Nano-Oscillator"
        place: "Undergraduate thesis, Dept. of EEE, BUET. Supervisor: [Dr. Orchi Hassan](https://orchi.buet.ac.bd)"
        period: March 2025 - June 2026
        lines:
          - "Designed a hybrid spintronic-CMOS pulse-width-modulation (PWM) generator built around a field-free Spin Hall Nano-Oscillator (SHNO) driven by spin-orbit torque, replacing conventional high-speed CMOS oscillator cores."
          - "Simulated and compared two circuit architectures (a 7T-1MTJ single-pFET design and a CMOS transmission-gate variant) using a macrospin LLGS model for the MTJ and PTM FinFET cards."
          - "Achieved 7.5 GHz oscillation with 6-95% duty-cycle tuning at under 50 µW; the transmission-gate variant gives about 4x lower control sensitivity with R² > 0.98 linearity over a 20-85% range."

      - heading: "Spintronic Non-Volatile Memory: Device Physics and Circuit Design"
        place: "Undergraduate research, Dept. of EEE, BUET. Supervisor: [Dr. Orchi Hassan](https://orchi.buet.ac.bd)"
        period: March 2025 - Present
        lines:
          - "Investigating Spin-Transfer Torque (STT) and Spin-Orbit Torque (SOT) switching in Magnetic Tunnel Junctions (MTJs) for next-generation Non-Volatile Memory (NVM) architectures."
          - "Extending this work toward two-dimensional material platforms, modelling memristive and spintronic device behaviour for synaptic and neuronal emulation in neuromorphic hardware."

